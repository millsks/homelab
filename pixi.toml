[workspace]
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
name = "homelab"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

# Procedure: PROC-CONVERGENCE-HARNESS — runbook: runbooks/l0-physical/convergence-harness.md
#
# The Automation half of PROC-CONVERGENCE-HARNESS is this file. Tool configuration has no free-form
# metadata mechanism, so the comment above is the back-reference the dual-form contract requires —
# see "The dual-form contract" in PROCEDURE-INDEX.md. The audit reads it; do not reword it.
[tasks]
bootstrap = "pre-commit install --install-hooks"
fmt = "sh -c 'ruff format . 2>/dev/null || true; [ -d tofu ] && tofu fmt -recursive tofu || true'"
lint-py = "ruff check ."
lint-yaml = "yamllint --strict ."
# Guards use `if`, never `dir && cmd || echo`: with `||` any non-zero exit from the
# command takes the echo branch and the task reports success, so a real lint failure
# passes the gate. Only the directory test may short-circuit.
lint-ansible = '''sh -c 'if [ -d ansible ]; then ansible-lint ansible; else echo "no ansible/ yet — skipping"; fi' '''
check = '''sh -c 'if [ -d src ]; then mypy src; else echo "no src/ yet — skipping"; fi' '''
# `tofu validate` has no -recursive and evaluates exactly one root module directory,
# so validating `tofu/` itself validates nothing once the .tf files live in tofu/l*/.
# Each layer directory holding *.tf is its own root module and is validated separately.
tofu-validate = '''
sh -c '
if [ ! -d tofu ]; then echo "no tofu/ yet — skipping"; exit 0; fi
processed=0
failed=0
for d in tofu/*/; do
  if ls "$d"*.tf >/dev/null 2>&1; then
    processed=$((processed + 1))
    echo "==> tofu validate $d"
    if ( cd "$d" && tofu init -backend=false -input=false >/dev/null && tofu validate ); then
      :
    else
      failed=$((failed + 1))
      echo "FAILED: $d"
    fi
  fi
done
echo "tofu-validate: $processed root module(s) processed, $failed failed"
[ "$failed" -eq 0 ]
'
'''
sprint-status = "python .claude/skills/bmad-sprint-planning/scripts/sprint_plan.py status --status-file _bmad-output/implementation-artifacts/sprint-status.yaml"
sprint-validate = "python .claude/skills/bmad-sprint-planning/scripts/sprint_plan.py validate --status-file _bmad-output/implementation-artifacts/sprint-status.yaml"

# The convergence harness. `src/` is on PYTHONPATH rather than pip-installed: this Repository is
# infrastructure-as-code that happens to contain one package, not a distributable Python project,
# and an editable install would add a build backend nothing else here needs.
audit = { cmd = "python -m asgard_harness audit --root .", env = { PYTHONPATH = "src" } }
selfcheck = { cmd = "python -m asgard_harness selfcheck --root .", env = { PYTHONPATH = "src" } }
# AD-23's scheduled check-mode run. Registered as an alert source in PROCEDURE-INDEX.md; a
# non-empty diff exits non-zero and the run is recorded to drift-record.json either way.
drift = { cmd = "python -m asgard_harness drift --root . --record drift-record.json", env = { PYTHONPATH = "src" } }
# AD-3 convergence and NFR-3 idempotence: every Automation run twice. Like `drift`, this reaches
# managed hosts, so it is scheduled and is deliberately NOT in the `ci` chain — a merge gate that
# shells out to `tofu plan` against production is a gate nobody can run from a laptop.
converge = { cmd = "python -m asgard_harness converge --root . --record converge-record.json", env = { PYTHONPATH = "src" } }
test = "pytest tests/unit"
test-integration = "pytest tests/integration"
cov = "pytest tests --cov=asgard_harness --cov-report=term-missing --cov-fail-under=90"

lint = { cmd = 'echo "lint complete"', depends-on = ["lint-py", "lint-yaml", "lint-ansible"] }
harness = { cmd = 'echo "harness complete"', depends-on = ["cov", "audit", "selfcheck"] }
ci = { cmd = 'echo "CI gate passed"', depends-on = ["lint", "check", "tofu-validate", "harness"] }
changelog = "git-cliff -o CHANGELOG.md"

[dependencies]
# Python itself is NOT pinned here. It is pinned per version-feature below, so that the CI matrix
# can materialise a real interpreter for every version in the supported range. A pin in this table
# belongs to the implicit `default` feature, which is present in EVERY environment, and would
# therefore conflict with each matrix feature's own pin.
"ruamel.yaml" = ">=0.18"
ansible-core = ">=2.21.3,<3"
opentofu = ">=1.12.6,<2"
structlog = ">=25.4,<26"

[feature.dev.dependencies]
ruff = "*"
mypy = "*"
pre-commit = "*"
yamllint = "*"
ansible-lint = "*"
git-cliff = ">=2.13.1,<3"
pytest = ">=8.4,<9"
pytest-cov = ">=7.0,<8"

# One feature per supported interpreter. The floor is 3.12: `pyproject.toml` declares
# `requires-python = ">=3.12"`, and both mypy and ruff target that floor rather than the development
# version. Targeting the development version is what let 3.14-only syntax reach the working tree in
# the first place — the checker agreed with the interpreter it happened to be running under, which
# is the one machine that could never catch the error.
[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["py314", "dev"]
py312 = ["py312", "dev"]
py313 = ["py313", "dev"]
py314 = ["py314", "dev"]
