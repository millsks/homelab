---
# Procedure: PROC-CONVERGENCE-HARNESS — runbook: runbooks/l0-physical/convergence-harness.md
#
# Three jobs, split by what they are allowed to touch:
#
#   gate      — `pixi run ci` on every push and pull request, across every supported interpreter.
#               Reads committed documents and the working tree. Touches no managed system, needs no
#               credential, and must stay that way: it is the merge gate.
#   drift     — AD-23's SCHEDULED check-mode run over the push-based layers L0-L2, which have no
#               reconciliation loop. A non-empty diff exits non-zero, and so does a run that failed
#               to complete. The record is uploaded either way, because "it must not pass silently"
#               means the evidence has to outlive the job.
#   converge  — AD-3 and NFR-3: every Automation run twice, first run for convergence and second for
#               idempotence. Scheduled for the same reason as drift — it reaches real hosts.
#
# Actions are pinned to commit SHAs, not to floating tags. AD-20 prohibits `latest`, and `@v4` is
# `latest` wearing a version number: the tag moves, so the same workflow file runs different code
# on different days. The human-readable version is in the trailing comment.
name: CI

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # 06:17 UTC daily. Off the hour on purpose: the top of the hour is the busiest scheduling slot
    # on shared runners, and a drift check queued for an hour is a drift check nobody reads.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per ref. A superseded pull-request run tells you about code nobody will merge,
# while the run that matters queues behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned exactly, like every other tool in this Repository. `latest` here would mean the gate's
  # own runner changed under it without a commit.
  PIXI_VERSION: v0.70.2

jobs:
  gate:
    name: Gate (Python ${{ matrix.python }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The supported range declared by `requires-python` in pyproject.toml. Testing only the
        # development version is how 3.14-only syntax reached the working tree: every checker
        # agreed with the one interpreter that could not catch it.
        python: ["3.12", "3.13", "3.14"]
        include:
          - python: "3.12"
            environment: py312
          - python: "3.13"
            environment: py313
          - python: "3.14"
            environment: py314
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The audit's stale-provenance check asks git which commit last touched epics.md. A
          # shallow clone cannot answer, and the check would degrade to SKIP — which does not fail
          # the gate, so the rule would silently stop being enforced.
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e  # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: ${{ matrix.environment }}
          locked: true

      - name: Run the full gate
        run: pixi run -e ${{ matrix.environment }} ci

  drift:
    name: Scheduled drift detection
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e  # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true

      - name: Check-mode run over the push-based layers
        run: pixi run drift

      - name: Record the run
        # Runs even when the step above exits non-zero: a non-empty diff, or a check-mode run that
        # failed to complete, is precisely the run whose record matters most. A record kept only on
        # success records nothing worth keeping.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: drift-record
          path: drift-record.json
          if-no-files-found: error

  converge:
    name: Scheduled convergence and idempotence
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e  # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          locked: true

      - name: Run every Automation twice
        run: pixi run converge

      - name: Record the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: converge-record
          path: converge-record.json
          if-no-files-found: error
